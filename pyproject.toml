[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-zomboid-mod-manager"
version = "0.2.2"
description = "A Windows-first desktop mod manager for Project Zomboid."
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
zomboid-sorter = "zomboid_mod_manager.__main__:main"

[project.optional-dependencies]
dev = ["ruff>=0.9"]
windows = ["pyinstaller>=6.0"]


[tool.setuptools.packages.find]
where = ["src"]
