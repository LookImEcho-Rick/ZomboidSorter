name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<version> tag to release'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Validate tag and version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_TAG }
          if ($tag -ne "v$version") { throw "Tag $tag does not match project version $version" }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev,windows]" -c packaging/constraints-windows.txt
      - name: Test and lint
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          python -m unittest discover -s tests -v
          ruff check src tests
          ruff format --check src tests
          python -m compileall -q src tests
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build app bundle
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,windows]" -c packaging\constraints-windows.txt
          .\packaging\build_windows.ps1
      - name: Check code-signing configuration
        shell: pwsh
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_SIGNING_ENDPOINT',
            'AZURE_SIGNING_ACCOUNT_NAME',
            'AZURE_SIGNING_CERTIFICATE_PROFILE_NAME'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Configure the required GitHub code-signing settings: $($missing -join ', ')" }
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}/dist/ZomboidSorter/ZomboidSorter.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZomboidSorter
          description-url: https://github.com/LookImEcho-Rick/ZomboidSorter
      - name: Verify application signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature dist/ZomboidSorter/ZomboidSorter.exe
          if ($signature.Status -ne 'Valid') { throw "Application signature is not valid: $($signature.StatusMessage)" }
          Write-Host "Signed publisher: $($signature.SignerCertificate.Subject)"
      - name: Build installer with portable mode
        shell: pwsh
        run: .\packaging\build_installer.ps1 -SkipAppBuild
      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/dist/installer
          files-folder-filter: ZomboidSorter-*-windows-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZomboidSorter Windows installer
          description-url: https://github.com/LookImEcho-Rick/ZomboidSorter
      - name: Verify installer signature and refresh checksum
        shell: pwsh
        run: |
          $version = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          $installer = Join-Path (Get-Location) "dist/installer/ZomboidSorter-$version-windows-setup.exe"
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.StatusMessage)" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$installer.sha256"
          Set-Content -LiteralPath $checksum -Value "$hash  $(Split-Path $installer -Leaf)" -Encoding ascii
          Write-Host "Signed publisher: $($signature.SignerCertificate.Subject)"
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
      - name: Check redistribution approval
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/RELEASE_READY -PathType Leaf)) {
            throw 'Binary release is blocked until packaging/RELEASE_READY is committed after the Qt/WebEngine license and source review.'
          }
      - name: Publish tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist/installer -File | Where-Object { $_.Name -match '\.(exe|sha256)$' } | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets --title "ZomboidSorter $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
