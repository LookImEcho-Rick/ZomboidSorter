name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<version> tag to release'
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints-windows.txt
      - name: Validate tag and version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_TAG }
          if ($tag -ne "v$version") { throw "Tag $tag does not match project version $version" }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,windows]" -c packaging\constraints-windows.txt
      - name: Test and lint
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          $python = Join-Path (Get-Location) '.venv\Scripts\python.exe'
          $ruff = Join-Path (Get-Location) '.venv\Scripts\ruff.exe'
          & $python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          & $ruff check src tests
          if ($LASTEXITCODE -ne 0) { throw 'Ruff check failed.' }
          & $ruff format --check src tests
          if ($LASTEXITCODE -ne 0) { throw 'Ruff format check failed.' }
          & $python -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed.' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build app bundle
        shell: pwsh
        run: .\packaging\build_windows.ps1 -SkipDependencyInstall
      - name: Build installer
        shell: pwsh
        run: .\packaging\build_installer.ps1 -SkipAppBuild
      - name: Check redistribution approval
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/RELEASE_READY -PathType Leaf)) {
            throw 'Binary release is blocked until packaging/RELEASE_READY is committed after the Qt/WebEngine license and source review.'
          }
      - name: Download previous stable installer for upgrade smoke test
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentVersionText = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          $currentVersion = [version]$currentVersionText
          $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list previous stable GitHub releases.' }
          $previousTag = $releaseTags |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]($_.Substring(1)) -lt $currentVersion } |
            Sort-Object -Descending { [version]($_.Substring(1)) } |
            Select-Object -First 1
          if (-not $previousTag) {
            Write-Host 'No earlier stable release is available; smoke test will reinstall the current installer.'
            'installer_path=' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $previousVersion = $previousTag.Substring(1)
          $assetNames = @(gh release view $previousTag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not list assets for previous release $previousTag." }
          $installerName = if ($assetNames -contains 'ZomboidSorter-windows-setup.exe') {
            'ZomboidSorter-windows-setup.exe'
          } else {
            "ZomboidSorter-$previousVersion-windows-setup.exe"
          }
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'zomboid-sorter-previous-release'
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
          gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern $installerName --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous installer $installerName." }
          gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern "$installerName.sha256" --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw "Could not download checksum for $installerName." }
          $previousInstaller = Join-Path $downloadDirectory $installerName
          $checksumPath = "$previousInstaller.sha256"
          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw -Encoding ascii).Trim()
          $checksumMatch = [regex]::Match($checksumLine, '^([0-9a-fA-F]{64})\s+\*?' + [regex]::Escape($installerName) + '$')
          if (-not $checksumMatch.Success) { throw 'Previous installer checksum file has an unexpected format.' }
          $actualHash = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $checksumMatch.Groups[1].Value.ToLowerInvariant()) { throw 'Previous installer checksum verification failed.' }
          "installer_path=$previousInstaller" >> $env:GITHUB_OUTPUT
      - name: Smoke-test standard and portable installer modes
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_PATH: ${{ steps.previous-release.outputs.installer_path }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dist/installer' -File -Filter 'ZomboidSorter-windows-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one current installer, found $($installers.Count)." }
          $arguments = @{ InstallerPath = $installers[0].FullName }
          if ($env:PREVIOUS_INSTALLER_PATH) { $arguments.PreviousInstallerPath = $env:PREVIOUS_INSTALLER_PATH }
          .\packaging\smoke_test_installer.ps1 @arguments
      - name: Upload installer smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-logs
          path: ${{ runner.temp }}/ZomboidSorter-installer-smoke-*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/installer/ZomboidSorter-windows-setup.exe
            dist/installer/ZomboidSorter-windows-setup.exe.sha256
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          compression-level: 0
      - name: Publish tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist/installer -File | Where-Object { $_.Name -match '\.(exe|sha256)$' } | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets --title "ZomboidSorter $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
